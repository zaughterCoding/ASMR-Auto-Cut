[project]
name = "asmr-auto-cut"
version = "0.4.0"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26",
  "pydantic>=2.8",
  "soundfile>=0.12",
  "typer>=0.12",
]

[project.optional-dependencies]
# pyinstaller 是打包工具，不进运行时依赖：只有 backend/packaging/ 下的 spec 用得到。
dev = ["pytest>=8.2", "pyinstaller>=6.0"]
# 只要 onnxruntime。上游的 silero-vad 装不动——它把 torch>=1.12 和 torchaudio 写死在
# 依赖里，连带 onnx 那条路也要（`load_silero_vad(onnx=True)` 的状态仍用 torch 张量存），
# 而那份 torch 是 4.4G。模型文件和那 100 行切区间代码已经由 analysis/silero_onnx.py
# 接手，权重放在 asmr_auto_cut/assets/ 里。
ml = ["onnxruntime>=1.16"]

[project.scripts]
asmr-auto-cut = "asmr_auto_cut.cli:app"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["asmr_auto_cut*"]

[tool.setuptools.package-data]
# Silero 的 ONNX 权重随包走。2.3MB 进仓库是刻意的：clone 下来就该能跑，
# 不该在第一次分析时才去某个 URL 上碰运气。
asmr_auto_cut = ["assets/*.onnx"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
# 临时目录放在项目内，避免落到 C 盘用户缓存；本机 C 盘的 pytest 临时根目录
# (pytest-of-*) 权限已损坏，直接指向项目内可绕开。
addopts = "--basetemp=.pytest_tmp"
