[project]
name = "asmr-auto-cut"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26",
  "pydantic>=2.8",
  "soundfile>=0.12",
  "typer>=0.12",
]

[project.optional-dependencies]
dev = ["pytest>=8.2"]
# silero-vad 6.x 的 __init__.py 会无条件 import sequence_vad，而后者 import onnxruntime，
# 但 onnxruntime 只声明在 onnx-cpu / onnx-gpu 这两个 extra 里。不装 onnxruntime
# 的话连 `import silero_vad` 都会失败，所以这里必须带上 onnx-cpu extra。
# torch/torchaudio 的 CUDA 版本要从 PyTorch 官方 index 单独装，见 README。
ml = ["torch>=2.3", "silero-vad[onnx-cpu]>=5.1"]

[project.scripts]
asmr-auto-cut = "asmr_auto_cut.cli:app"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["asmr_auto_cut*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
# 临时目录放在项目内，避免落到 C 盘用户缓存；本机 C 盘的 pytest 临时根目录
# (pytest-of-*) 权限已损坏，直接指向项目内可绕开。
addopts = "--basetemp=.pytest_tmp"
