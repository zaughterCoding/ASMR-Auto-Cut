[package]
name = "asmr-auto-cut"
version = "0.1.0"
description = "ASMR Auto Cut desktop shell"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# protocol-asset: webview 不能直接读 file://，播放原始音频要走 asset 协议，
# 对应 tauri.conf.json 里的 app.security.assetProtocol。
tauri = { version = "2", features = ["protocol-asset"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
